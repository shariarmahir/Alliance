[project]
name = "allaince-backend"
version = "0.1.0"
description = "AutoLink Integrated Technologies — standalone FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Integrations are optional extras so the core API installs and tests without
# native build deps (WeasyPrint needs GTK on Windows, for example).
integrations = [
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.150",
    "resend>=2.4",
    "weasyprint>=63.0",
    "boto3>=1.35",
    "redis>=5.2",
    "cryptography>=43.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
